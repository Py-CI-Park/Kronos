  VIEWS.opening = function(){ return stub("오프닝 30m RL","opening_30m · RULE 필터 + RL 실험","시초 30분 라인. RULE 필터(rule_filter, 비-RL 증거)와 RL 실험(rl_workflow)으로 갈립니다. ts_imb RULE 메인라인과만 비교."); };

  function stub(t,sub,desc){ return '<div class="eyebrow">'+sub+'</div><h1 class="pt">'+t+'</h1><p class="lede">'+desc+'</p><div class="ph"><div class="big">'+t+' — 상세 화면</div>이 초안에서는 자리표시자입니다. 승인 시 실데이터·차트로 구성합니다.</div>'; }

  function shell(){
    var nav = NAV.map(function(g){
      return '<div class="navlbl">'+g.grp+'</div>'+g.items.map(function(it){
        var right = it.bdg ? '<span class="bdg">'+it.bdg+'</span>' : (it.stat ? '<span class="stat st-'+it.stat+'"></span>' : '');
        var lbl = '<span class="nlab"><span>'+it.label+'</span>'+(it.note?'<span class="nnote">'+it.note+'</span>':'')+'</span>';
        return '<div class="nav" data-go="'+it.id+'"'+(it.sub?' data-sub="1"':'')+'><span class="ic">'+(it.ic||(it.sub?"└":"›"))+'</span>'+lbl+right+'</div>';
      }).join("");
    }).join("");
    return '<aside class="sb">'+
      '<div class="brand"><div class="logo">K</div><div><b>Kronos</b><span>research command</span></div></div>'+
      '<div class="navgrp">'+nav+'</div>'+
      '<div class="sbfoot"><div class="runc"><div class="r1"><span class="dot"></span>predictor ok</div><div class="nm">stom_1s_grid_pred60_2025_full_small</div></div></div>'+
      '</aside>'+
      '<div class="main">'+
        '<header class="hdr"><div><div class="crumb" id="crumb"></div><div class="htitle" id="htitle"></div></div><div class="sp"></div>'+
          '<span class="hchip"><span class="d"></span>WATCH · RESEARCH_ONLY</span>'+
          '<button class="hbtn" id="themeBtn">◐ 테마</button>'+
        '</header>'+
        '<div class="page" id="page"></div>'+
      '</div>';
  }

  var view = "mission";
  function paint(){
    document.querySelectorAll(".nav").forEach(function(n){ n.setAttribute("data-on", n.getAttribute("data-go")===view?"1":"0"); });
    var t = TITLES[view]||["",""]; document.getElementById("crumb").textContent="Kronos · "+t[0]; document.getElementById("htitle").textContent=t[1];
    document.getElementById("page").innerHTML = (VIEWS[view]||VIEWS.mission)();
    window.scrollTo({top:0,behavior:"smooth"});
  }
  window.__t=function(m){ R.setAttribute("data-theme",m); };

  document.getElementById("app").innerHTML = shell();
  document.getElementById("app").addEventListener("click", function(e){
    var go = e.target.closest("[data-go]");
    if(go){ view = go.getAttribute("data-go"); paint(); return; }
    if(e.target.closest("#themeBtn")){ var c=R.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"); R.setAttribute("data-theme", c==="dark"?"light":"dark"); }
  });
  paint();
})();
</script>
